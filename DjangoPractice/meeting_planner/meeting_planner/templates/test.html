<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #1a1a2e;
  }
  .calendar {
    background: #16213e;
    border-radius: 16px;
    padding: 24px;
    width: 340px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .header span {
    color: #fff;
    font-size: 18px;
    font-weight: 600;
  }
  .header button {
    background: #0f3460;
    color: #fff;
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    transition: background .2s;
  }
  .header button:hover { background: #e94560; }
  .weekdays, .days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .weekdays div {
    text-align: center;
    color: #e94560;
    font-size: 12px;
    font-weight: 700;
    padding: 8px 0;
  }
  .days div {
    text-align: center;
    color: #ccc;
    font-size: 14px;
    padding: 10px 0;
    border-radius: 8px;
    cursor: default;
    transition: background .2s;
  }
  .days div:not(:empty):hover { background: #0f3460; }
  .days .today {
    background: #e94560;
    color: #fff;
    font-weight: 700;
  }
</style>
</head>
<body>

<div class="calendar">
  <div class="header">
    <button id="prev">&#8249;</button>
    <span id="label"></span>
    <button id="next">&#8250;</button>
  </div>
  <div class="weekdays">
    <div>Mon</div><div>Tue</div><div>Wed</div>
    <div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
  </div>
  <div class="days" id="grid"></div>
</div>

<script>
  const label = document.getElementById('label');
  const grid  = document.getElementById('grid');

  const today = new Date(2026, 9, 2); // Oct 2, 2026
  let viewYear  = 2026;
  let viewMonth = 9; // 0-indexed

  const MONTHS = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];

  function render() {
    label.textContent = `${MONTHS[viewMonth]} ${viewYear}`;
    grid.innerHTML = '';

    const firstDay  = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const offset = (firstDay + 6) % 7; // Monday-start offset

    for (let i = 0; i < offset; i++)
      grid.appendChild(document.createElement('div'));

    for (let d = 1; d <= daysInMonth; d++) {
      const cell = document.createElement('div');
      cell.textContent = d;
      if (d === today.getDate() &&
          viewMonth === today.getMonth() &&
          viewYear  === today.getFullYear())
        cell.classList.add('today');
      grid.appendChild(cell);
    }
  }

  document.getElementById('prev').onclick = () => {
    viewMonth--;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    render();
  };

  document.getElementById('next').onclick = () => {
    viewMonth++;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    render();
  };

  render();
</script>

</body>
</html>
